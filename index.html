<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Presentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            overflow-x: hidden;
        }

        .slide {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        .video-slide {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        .youtube-slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000000;
        }

        .youtube-slide iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .link-slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: block;
        }

        .link-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .clickable-area {
            position: absolute;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .clickable-area:hover {
            opacity: 0.8;
        }

        /* Adjust these positions based on where your icons are located */
        /* You'll need to customize these values */
        .link1 {
            top: 50%;
            left: 30%;
            width: 15%;
            height: 20%;
            transform: translate(-50%, -50%);
        }

        .link2 {
            top: 50%;
            left: 70%;
            width: 15%;
            height: 20%;
            transform: translate(-50%, -50%);
        }

        /* Container to hold both the background image and the video */
        .overlay-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Force the image to stay in the background */
        .overlay-container .slide {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            /* Lower layer */
        }

        .overlay-container .youtube-slide {
            position: absolute;
            /* Increase 'top' to move the video lower (e.g., 60% instead of 50%) */
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);

            /* Decrease height so it doesn't hit the bottom of the screen */
            width: 70%;
            height: 60%;

            z-index: 2;
            background: transparent;
        }

        /* Container for Slide 8 */
        .video-overlay-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Container to position the icons 20% from the bottom */
        .icon-container {
            position: absolute;
            /* This forces the container to stay between Top 75% and Bottom 15% */
            top: 75%;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);

            display: flex;
            align-items: center;
            /* Centers icons vertically within that 10% space */
            gap: 2vw;
            /* Responsive gap based on screen width */
            z-index: 10;
        }

        .icon-link {
            height: 100%;
            /* Forces the link to fill the 10% height allowed */
            display: block;
        }

        .icon-link img {
            height: 100%;
            /* Forces the image to scale to the container height */
            width: auto;
            /* Keeps the icon from looking squashed or stretched */
            display: block;
        }

        .icon-link:hover {
            transform: scale(1.1);
            /* Slight pop effect on hover */
        }
    </style>
</head>

<body>
    <!-- Slide 1: Video -->
    <video class="video-slide" autoplay muted loop playsinline>
        <source src="videos/1.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Slide 2: Image -->
    <img src="images/2.png" alt="Slide 2" class="slide">

    <!-- Slide 3: Image -->
    <img src="images/3.png" alt="Slide 3" class="slide">

    <!-- Slide 4: Image -->
    <img src="images/4.png" alt="Slide 4" class="slide">

    <!-- Slide 5: Image -->
    <img src="images/5.png" alt="Slide 5" class="slide">

    <!-- Slide 6: Image -->
    <img src="images/6.png" alt="Slide 6" class="slide">

    <!-- Slide 7: YouTube Embed -->
    <div class="overlay-container">
        <img src="images/7.png" alt="Slide 7" class="slide">

        <div class="youtube-slide">
            <iframe src="https://www.youtube.com/embed/IojjWrA5L28"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- Slide 8: video with Clickable Links -->
    <div class="video-overlay-wrapper">
        <video class="video-slide" autoplay muted loop playsinline>
            <source src="videos/8.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="icon-container">
            <a href="https://www.instagram.com/lumisound_xrlab?igsh=MWdreTR0dW85M203dw==" target="_blank"
                class="icon-link">
                <img src="images/icon1.png" alt="Link 1">
            </a>

            <a href="https://www.linkedin.com/in/yichunko/" target="_blank" class="icon-link">
                <img src="images/icon2.png" alt="Link 2">
            </a>
        </div>
    </div>
</body>

</html>

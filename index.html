<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Presentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0;
        }
        
        .slide {
            width: 100%;
            display: block;
            margin: 0;
        }
        
        /* Optional: Add small spacing between slides */
        .slide + .slide {
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="images/slide1.png" alt="Slide 1" class="slide">
        <img src="images/slide2.png" alt="Slide 2" class="slide">
        <img src="images/slide3.png" alt="Slide 3" class="slide">
        <img src="images/slide4.png" alt="Slide 4" class="slide">
        <img src="images/slide5.png" alt="Slide 5" class="slide">
        <!-- Add more slides as needed -->
    </div>
</body>
</html>

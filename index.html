<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Presentation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            overflow-x: hidden;
        }

        /* Base slide styling - images are 4269x2400 (16:9 aspect ratio) */
        .slide {
            width: 100vw;
            height: 100vh;
            display: block;
            object-fit: contain; /* Default to contain to prevent trimming */
            object-position: center;
            background: #000000;
        }

        /* Landscape devices (wider than 16:9) - use cover to fill screen */
        @media (min-aspect-ratio: 16/9) {
            .slide {
                object-fit: cover;
            }
        }

        /* Portrait and narrow devices - make height match actual image */
        @media (max-aspect-ratio: 16/9) {
            .slide {
                height: calc(100vw * 9 / 16); /* Height matches 16:9 aspect ratio */
                object-fit: cover; /* Fill the calculated area */
                object-position: center;
            }
        }

        /* Video slide responsive styling */
        .video-slide {
            width: 100vw;
            height: 100vh;
            object-fit: contain; /* Default to contain */
            display: block;
            background: #000000;
        }

        /* Landscape devices (wider than 16:9) - use cover */
        @media (min-aspect-ratio: 16/9) {
            .video-slide {
                object-fit: cover;
            }
        }

        /* Portrait and narrow devices - make height match actual video */
        @media (max-aspect-ratio: 16/9) {
            .video-slide {
                height: calc(100vw * 9 / 16); /* Height matches 16:9 aspect ratio */
                object-fit: cover; /* Fill the calculated area */
                object-position: center;
            }
        }

        /* YouTube slide container */
        .youtube-slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000000;
        }

        .youtube-slide iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Link slide with responsive clickable areas */
        .link-slide {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: block;
        }

        .link-slide img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            background: #000000;
        }

        .clickable-area {
            position: absolute;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .clickable-area:hover {
            opacity: 0.8;
        }

        .link1 {
            top: 50%;
            left: 30%;
            width: 15%;
            height: 20%;
            transform: translate(-50%, -50%);
        }

        .link2 {
            top: 50%;
            left: 70%;
            width: 15%;
            height: 20%;
            transform: translate(-50%, -50%);
        }

        /* Overlay container for Slide 7 with responsive YouTube embed */
        .overlay-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #000000;
        }

        /* Portrait - make container match image height */
        @media (max-aspect-ratio: 16/9) {
            .overlay-container {
                height: calc(100vw * 9 / 16);
            }
        }

        .overlay-container .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            object-fit: contain;
        }

        /* Portrait - fill the calculated container */
        @media (max-aspect-ratio: 16/9) {
            .overlay-container .slide {
                object-fit: cover;
            }
        }

        /* Adjust background image for wider screens */
        @media (min-aspect-ratio: 16/9) {
            .overlay-container .slide {
                object-fit: cover;
            }
        }

        .overlay-container .youtube-slide {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%;
            height: 60%;
            z-index: 2;
            background: transparent;
        }

        /* Responsive adjustments for YouTube overlay */
        @media (max-width: 1024px) {
            .overlay-container .youtube-slide {
                width: 80%;
                height: 50%;
                top: 55%;
            }
        }

        @media (max-width: 768px) {
            .overlay-container .youtube-slide {
                width: 90%;
                height: 40%;
                top: 50%;
            }
        }

        @media (max-width: 480px) {
            .overlay-container .youtube-slide {
                width: 95%;
                height: 35%;
                top: 50%;
            }
        }

        /* Video overlay wrapper for Slide 8 */
        .video-overlay-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Portrait - make container match video height */
        @media (max-aspect-ratio: 16/9) {
            .video-overlay-wrapper {
                height: calc(100vw * 9 / 16);
                align-items: stretch;
            }
        }

        .video-overlay-wrapper .video-slide {
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Icon container positioned relative to video content area */
        .icon-container {
            position: absolute;
            left: 50%;
            bottom: 15%; /* 15% from bottom */
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2vw;
            z-index: 10;
            max-width: 90%;
        }

        /* Responsive icon container adjustments */
        @media (max-width: 768px) {
            .icon-container {
                gap: 4vw;
            }
        }

        @media (max-width: 480px) {
            .icon-container {
                gap: 6vw;
            }
        }

        .icon-link {
            height: 100%;
            display: block;
            transition: transform 0.3s ease;
        }

        .icon-link img {
            height: 100%;
            width: auto;
            max-height: 8vh;
            display: block;
        }

        /* Responsive icon sizes */
        @media (max-width: 768px) {
            .icon-link img {
                max-height: 6vh;
            }
        }

        @media (max-width: 480px) {
            .icon-link img {
                max-height: 5vh;
            }
        }

        .icon-link:hover {
            transform: scale(1.1);
        }

        /* Landscape orientation adjustments */
        @media (orientation: landscape) and (max-height: 500px) {
            .icon-container {
                top: 70%;
                bottom: 5%;
            }
            
            .icon-link img {
                max-height: 10vh;
            }
        }

        /* Ultra-wide screen adjustments */
        @media (min-aspect-ratio: 21/9) {
            .overlay-container .youtube-slide {
                width: 50%;
                height: 70%;
            }
        }

        /* Portrait mode adjustments - IMPROVED FOR TALL SCREENS */
        @media (orientation: portrait) {
            .overlay-container .youtube-slide {
                width: 80%;
                height: 60%;
                top: 58%;
            }
            
            .icon-container {
                flex-direction: row;
                gap: 8vw;
            }
        }
        
        /* Extra tall/narrow screens (taller than 16:9) - ADDED */
        @media (max-aspect-ratio: 9/16) {
            .overlay-container .youtube-slide {
                width: 92%;
                height: 50%;
                top: 60%;
            }
        }
    </style>
</head>

<body>
    <!-- Slide 1: Video -->
    <video class="video-slide" autoplay muted loop playsinline preload="auto">
        <source src="videos/1.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <!-- Slide 2: Image -->
    <img src="images/2.png" alt="Slide 2" class="slide">

    <!-- Slide 3: Image -->
    <img src="images/3.png" alt="Slide 3" class="slide">

    <!-- Slide 4: Image -->
    <img src="images/4.png" alt="Slide 4" class="slide">

    <!-- Slide 5: Image -->
    <img src="images/5.png" alt="Slide 5" class="slide">

    <!-- Slide 6: Image -->
    <img src="images/6.png" alt="Slide 6" class="slide">

    <!-- Slide 7: YouTube Embed -->
    <div class="overlay-container">
        <img src="images/7.png" alt="Slide 7" class="slide">

        <div class="youtube-slide">
            <iframe src="https://www.youtube.com/embed/IojjWrA5L28"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <!-- Slide 8: video with Clickable Links -->
    <div class="video-overlay-wrapper">
        <video class="video-slide" autoplay muted loop playsinline preload="auto">
            <source src="videos/8.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <div class="icon-container">
            <a href="https://www.instagram.com/lumisound_xrlab?igsh=MWdreTR0dW85M203dw==" target="_blank"
                class="icon-link">
                <img src="images/icon1.png" alt="Link 1">
            </a>

            <a href="https://www.linkedin.com/in/yichunko/" target="_blank" class="icon-link">
                <img src="images/icon2.png" alt="Link 2">
            </a>
        </div>
    </div>
</body>

</html>
